# Nginx 反向代理 + 入口限流（对应需求文档 3.1 架构入口层 / 3.10 API 设计）
#
# 职责：
#   1) 反向代理到 FastAPI 应用（upstream 可水平扩展为多副本）
#   2) 入口限流：任务创建接口按 IP 严格限流并返回 429（需求 N6：防止未授权/滥用触发昂贵任务）
#   3) 请求 ID 透传、静态页缓存、gzip、/metrics 仅内网可达
#
# 限流分层（与需求 3.10「每个 token 每分钟最多触发 1 个新任务」配合，而非重复实现）：
#   Nginx 层 = 按 IP 的粗粒度闸门（挡扫描/误用）；应用层 = 按 token 的精确桶（Redis 令牌桶）
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # ---- 日志（JSON 结构，便于采集；字段风格与应用的 http_access 保持一致） ----
    log_format json_access escape=json
      '{"event":"nginx_access","ts":"$time_iso8601","client":"$remote_addr",'
      '"method":"$request_method","path":"$uri","status":$status,'
      '"duration_ms":$request_time,"bytes":$body_bytes_sent,'
      '"request_id":"$http_x_request_id","upstream_status":"$upstream_status",'
      '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_access;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    # text/html 已由 nginx 默认包含在压缩类型中，重复声明会产生 duplicate MIME type 告警
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    # ---- 限流：按客户端 IP 令牌桶 ----
    # 新建投研任务（POST /api/v1/research）：单任务耗时 5-8 分钟、并发上限 3（N7），
    # 属最昂贵入口 → 6 r/m + 突发 3；应用层再按 token 限 1 次/分钟（3.10）
    limit_req_zone $binary_remote_addr zone=create_zone:10m rate=6r/m;
    # 状态/报告查询等其余 API：30 r/s + 突发 60
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;
    # 单 IP 并发连接数上限
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- 上游：投研应用（多副本时在此列出全部实例，或用 DNS 轮询） ----
    upstream research_app {
        server app:8000 max_fails=3 fail_timeout=15s;
        # 生产多副本示例：
        # server app-1:8000 max_fails=3 fail_timeout=15s;
        # server app-2:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;      # 请求体仅公司名/ticker 等小 JSON

        # 请求 ID：有则透传，无则由应用生成
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 创建投研任务：严格限流；任务异步执行，创建接口本身只需入队（无需长超时）
        location = /api/v1/research {
            limit_req  zone=create_zone burst=3 nodelay;
            limit_conn conn_zone 16;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_pass http://research_app;
        }

        # 任务状态 / 报告获取：常规限流，报告正文可能较大
        location /api/v1/research/ {
            limit_req  zone=api_zone burst=60 nodelay;
            limit_conn conn_zone 64;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_pass http://research_app;
        }

        # 其余业务接口（健康检查、审计/管理只读接口等）
        location /api/ {
            limit_req  zone=api_zone burst=60 nodelay;
            limit_conn conn_zone 64;
            proxy_read_timeout 60s;
            proxy_pass http://research_app;
        }

        # 静态页面（任务进度 / 报告查看界面，需求 F7）：短缓存
        location /static/ {
            proxy_pass http://research_app;
            expires 5m;
            add_header Cache-Control "public";
        }

        # 指标端点：仅内网（Prometheus 容器）可访问
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://research_app;
        }

        # 探针
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

        # 默认：首页 / 任务列表页 / Swagger
        location / {
            limit_req zone=api_zone burst=60 nodelay;
            proxy_pass http://research_app;
        }
    }
}
